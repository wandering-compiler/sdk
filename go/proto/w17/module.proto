syntax = "proto3";

// Module / domain general configuration.
//
// `(w17.module)` is the top-level config option for a module
// (per-`<module>/w17.proto`) or a domain (per-`<domain>/w17.proto`).
// It carries DB connection + namespacing today; future fields
// (auth defaults, observability hints, etc.) live here too —
// the option is general module/domain config, not DB-only, so
// it's deliberately NOT under the `w17.db.*` namespace.
//
// Cascade: domain w17.proto → module w17.proto → file's own
// option, most-specific-wins per field. See loader.go for the
// merge mechanics.
//
// This file owns: Module, Connection, Dialect, Capability,
// StorageEncoding, Channel, Transport, EventDefaults. db.proto
// owns the per-table / per-column / per-method DB annotations
// and references the types defined here for connection +
// capability dispatch. RetryPolicy + Backoff live in event.proto
// (imported below) because per-event override is the most-specific
// retry tier; channels reference the shared shape.

package w17;

import "google/protobuf/descriptor.proto";
import "w17/event.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/w17;w17pb";

extend google.protobuf.FileOptions {
	// (w17.module) — module/domain-level configuration option.
	//
	// CONVENTION: it belongs in a `w17.proto` sentinel at
	// domain or module root, not in regular type / service files.
	// The convention is NOT enforced — the loader reads the option
	// wherever it finds it, and a regular file's own option is the
	// most-specific tier of the cascade above. Enforcement stays
	// deferred because the fixtures + shipped examples still declare
	// it file-level; adding the reject is a sweep, not a one-liner.
	//
	// One sub-field DOES enforce its scope: `channels[]` /
	// `event_defaults` are lifted only from the DOMAIN-ROOT
	// `w17.proto`, and a sub-module sentinel declaring them is a
	// parse-time diag (see those fields below).
  Module module = 51020;
}

message Module {
  // PG-native namespace qualifier. Empty = default schema
  // (`public`). When set, emitter qualifies every identifier
  // as `<schema>.<table>`. Orthogonal to the auto-derived
  // module prefix — both can apply.
  string schema = 1;

  // Whether the auto-derived module-name prefix prepends onto
  // every derived table name in the module. The field is at
  // module level — `prefix` alone would be ambiguous here
  // ("prefix of what?"), so the more explicit `table_prefix`
  // names what the option configures. Per-table override (with
  // unambiguous context) lives on `(w17.db.table).prefix`.
  //
  // Presence-aware:
  //
  //   unset           — default; module prefix applies
  //   table_prefix:true  — explicit; module prefix applies
  //                        (same as unset; useful for clarity)
  //   table_prefix:false — opt out; derived names stay bare
  //                        (`<module>` not prepended)
  //
  // Per-table override on `(w17.db.table).prefix` can re-enable
  // the prefix for one specific table even when the module
  // opted out — see the e2e-project's `flat/types::Setting` for
  // a worked example.
  optional bool table_prefix = 2;

  // Declares which DB connection the tables defined under this
  // option's scope target. Optional: absent = the project-wide
  // default connection.
  //
  // Uniqueness is on the NAME, not on (dialect, version): a
  // domain may hold several connections of the same dialect +
  // version (an `analytics` and a `transactional` PG 18, say) and
  // each gets its own migration bucket + lineage. Redeclaring one
  // NAME with a divergent dialect / version / used_capability /
  // encoding / query_memory_budget_bytes is what gets rejected —
  // the name is the identity of a physical DB target within the
  // domain (an earlier (dialect, version) bucket key collapsed
  // two same-dialect connections into one migration).
  //
  // Cascade: when set at domain level, every module + file
  // under that domain inherits it; module-level + file-level
  // overrides take precedence per the standard cascade.
  Connection connection = 3;

  // Declared event-bus channels for the enclosing
  // scope. Channel name is unique per domain (parallels the
  // connection-name uniqueness). Events reference a channel by
  // name via `(w17.event).channel`; subscriber registrations
  // reference it via `(w17.event_subscribers).subscriptions[].channel`.
  //
  // Conventionally declared at domain level (in the domain-root
  // `w17.proto`); sub-scopes may NOT override the channels list
  // — channel identity is domain-scoped, not module-scoped.
  // Parse-time diag if a non-domain `w17.proto` declares
  // `channels[]`.
  //
  // Empty list = domain has no event surface; no subscriber
  // binary is generated.
  repeated Channel channels = 4;

  // Domain-wide defaults for event delivery. Today
  // only `retry` is carried; future fields (observability,
  // tracing, etc.) land here. The retry cascade is documented
  // in `Event.retry`.
  //
  // Same scope rule as `channels`: domain-level only.
  EventDefaults event_defaults = 5;

  // Extra build-context excludes, appended to the `Dockerfile.dockerignore`
  // every generated bundle ships.
  //
  // It exists because the generated list cannot be complete and must not try to
  // be. A bundle builds with the PROJECT ROOT as its context — it has to, since
  // it imports hand-written code from outside `w17/` — and the generated excludes
  // cover exactly two things: a running stack's state, and trees w17 itself wrote
  // that no build step reads. They deliberately stop there rather than guess at
  // `dist/`, `target/`, `bin/` or a media directory, because those belong to the
  // project and guessing would decide what somebody else's code can see.
  //
  // The consequence, measured on a consumer 2026-09-30: their build context was
  // ~2.5 GB and BuildKit keeps one cache record of it PER BUNDLE built, so a
  // single build's records came to ~8 GB — while the same project's w17-generated
  // tree weighs 7.9 MB. The weight was their own, and they had no way to say so:
  // BuildKit reads `<dockerfile>.dockerignore` beside the Dockerfile IN PREFERENCE
  // to a `.dockerignore` at the context root, so the tool-owned file silently won
  // and a project-root exclude list did nothing for w17's builds.
  //
  // Declared here rather than read from a file on disk because codegen runs on the
  // CONSOLE, which sees the pushed proto tree and never the project's working
  // copy. A path only the client can read is a path the compiler cannot validate.
  //
  // ⚠️ Same danger as the generated list, and the same gate: an exclude that a
  // Dockerfile DOES read makes BuildKit copy nothing and say nothing, and the
  // failure surfaces as a missing file inside the image. Codegen refuses a pattern
  // that would hide a path the bundle's Dockerfile reads.
  //
  // Patterns are `.dockerignore` syntax, relative to the context root:
  //
  //   option (w17.module) = {
  //     build_context_excludes: ["frontend/dist/", "*.mp4", "testdata/large/"]
  //   };
  //
  // Domain-level like `channels`: the context is the project's, not a module's,
  // so every bundle gets the same list.
  repeated string build_context_excludes = 6;
}

// Connection identifies one DB target: a logical name + dialect
// + version + which capability of the dialect this connection
// uses. The name is the label used in `(w17.db.table).connection`
// overrides AND the identity the migration writer buckets on —
// artifacts land in `out/migrations/<connection-name>/` (bare
// `out/migrations/` for the iter-1 single-default layout). The
// dialect + capability + version triple is what the emitter
// dispatches on.
//
// The NAME identifies the physical target. Two files
// may redeclare the same name only when every axis agrees
// (dialect, version, used_capability, encoding,
// query_memory_budget_bytes) — that is the legitimate
// two-modules-one-database case. Any divergence is rejected.
message Connection {
  string name = 1;
  Dialect dialect = 2;
  string version = 3;

  // Which capability of the dialect this connection uses (D42).
  // Required when the dialect has multiple capabilities (e.g.
  // REDIS = KV or QUEUE); auto-filled to the dialect's sole
  // capability when single-capability (e.g. POSTGRES =
  // RELATIONAL). Author can always set explicitly for clarity.
  Capability used_capability = 4;

  // How values are serialised at storage time on this
  // connection. Only meaningful for KV capability — relational
  // dialects encode per-column via SQL types.
  //
  // PROTOBUF lands in v2.2 (D-iter3-19); JSON is today's
  // default + only encoding apply supports in v1 / v2.1.
  StorageEncoding encoding = 5;

  // Per-query memory budget the optimizer respects when picking
  // execution strategy. Bytes.
  //
  // This is OUR logical budget for a single query against this
  // connection — NOT the underlying DB's `work_mem` /
  // `join_buffer_size`. The DB's planner has its own budgets
  // configured at the server level; this annotation lets the
  // author cap our generated query memory independently. Reasons:
  //
  //   - SQLite / Redis / KV stores have no `work_mem` analogue —
  //     the budget still applies because we measure intermediate
  //     result-set size in our own host process.
  //   - The author may want our optimizer to be more
  //     conservative than the DB allows (e.g. to leave headroom
  //     for concurrent queries on a shared connection).
  //   - The number is portable — moving the same schema across
  //     connections of different dialects keeps the same logical
  //     ceiling.
  //
  // Authoring guidance:
  //
  //   - 0 (default / unset) = use the dialect default
  //     (currently 16 MiB across all dialects; subject to
  //     calibration in Fáze 1c).
  //   - Tune up for analytics workloads (large hash joins),
  //     down for OLTP serving where many small queries
  //     contend on the same backend.
  //   - Crossing this threshold doesn't fail the query — the
  //     optimizer picks PREFETCH / pipeline decomposition
  //     instead of in-memory JOIN. Worst case is more
  //     round-trips, not OOM.
  uint64 query_memory_budget_bytes = 6;
}

// StorageEncoding — how a KV connection serialises its values
// at storage time. Surfaces in data migration bodies (each
// migration declares the encoding that produced the values
// it's transforming, so the apply tool dispatches to the right
// codec).
enum StorageEncoding {
  STORAGE_ENCODING_UNSPECIFIED = 0;
  STORAGE_JSON = 1;
  STORAGE_PROTOBUF = 2;
}

enum Dialect {
  DIALECT_UNSPECIFIED = 0;
  POSTGRES = 1;
  MYSQL = 2;
  SQLITE = 3;
  // Redis (or other whole-model KV stores). Multi-capability:
  // KV + QUEUE (Streams). Connection picks one via
  // `used_capability`.
  REDIS = 10;
  // NATS — message broker (JetStream). Single capability:
  // QUEUE.
  NATS = 11;
  // S3 (or compatible object stores: GCS, MinIO, R2). Single
  // capability: KV — bucket-as-namespace, object key = lookup
  // key.
  S3 = 12;
  // Local filesystem — a path under the binary's process owner
  // serves as the KV namespace. Single capability: KV. Used
  // primarily for service-managed file uploads (the
  // UPLOADED_FILE / UPLOADED_IMAGE field types declare the
  // upload destination via a (LOCAL_FS, KV) connection).
  // Trade-offs vs networked KV stores: no native TTL (a write
  // that sets the canonical `ttl_seconds` column on a LOCAL_FS
  // connection is refused at typecheck — a filesystem has nothing
  // that expires an entry), no
  // built-in replication (multi-replica deploys need shared
  // FS like NFS), no built-in backup. For multi-node prod use
  // S3 or future OBJECT_STORAGE capability.
  LOCAL_FS = 13;
}

// Capability — what programming model a connection exposes
// (D42). Each Dialect declares the set of capabilities it
// supports; `Connection.used_capability` picks one.
//
// RELATIONAL — table-shaped DDL, SQL DML. (PG, MySQL, SQLite.)
// KV         — key-value store, manifest-only "schema".
//              (Redis-KV, S3.)
// QUEUE      — message broker / streams, manifest-only.
//              (Redis-streams, NATS.)
// DOCUMENT   — reserved for document stores (Mongo, Couch,
//              Firestore). No dialect today; design slot held
//              for future iter.
// GRAPH      — reserved for graph stores (Neo4j, ArangoDB,
//              Dgraph). No dialect today; design slot held for
//              future iter.
//
// Note (column-level orthogonality): a column may use a
// DB-specific feature (e.g. HSTORE on PG for `map<str,str>`)
// without the connection declaring the corresponding
// capability. Connection-level capability = primary
// programming interface; column-level db_type override =
// per-column escape into DB-specific feature set. The two
// axes are independent.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  RELATIONAL = 1;
  KV = 2;
  QUEUE = 3;
  DOCUMENT = 4;
  GRAPH = 5;
}

// Channel declares one event-bus transport binding.
//
// Channel name is the addressable identity (parallel to the
// connection-name rule): events emit by name, subscribers
// consume by name, env vars supply the per-channel DSN via
// `W17_QUEUE_<NAME>` (parity with `W17_TARGET_<CONN>`: sensitive
// data such as a DSN travels only in the environment). The transport choice is
// a deploy concern, not a logical-routing concern; topic +
// filter (declared on the event annotation + subscriber tuple)
// is the right knob for "which subscriber cares about this
// event".
//
// Multiple channels of the same transport are allowed (typical
// case: a `default` NATS stream + an `audit` NATS stream with
// longer retention). Each maps to a distinct underlying stream
// / subject prefix at runtime.
message Channel {
  // Domain-unique channel name. Snake_case identifier.
  // Required.
  string name = 1;

  // Transport this channel rides on. Required (UNSPECIFIED is
  // a parse-time diag — the deploy-time DSN var alone can't
  // disambiguate without knowing the transport shape).
  Transport transport = 2;

  // Channel-default retry policy. Applies to every event whose
  // `(w17.event).retry` doesn't override the relevant field
  // (presence-aware merge). Falls through to
  // `EventDefaults.retry` then the framework hard default per
  // `Event.retry`.
  RetryPolicy retry = 3;

  // Shutdown drain ceiling — how long the binary waits for
  // in-flight emit goroutines (MEMORY) / unacked deliveries
  // (NATS, REDIS_STREAMS) before forcing exit on SIGTERM.
  // Zero = framework default (30 seconds).
  int32 drain_timeout_seconds = 4;

  // MEMORY-only — bounded in-process queue length. Zero means
  // "drop on full" (the emit-side never blocks). Positive
  // means "block briefly (≤100ms) then drop". Ignored for
  // non-MEMORY transports (parse-time diag if set on NATS /
  // REDIS_STREAMS). Cross-process refusal rules: see
  // `TRANSPORT_MEMORY`.
  int32 buffer_size = 5;
}

// Transport enumerates the supported event-bus
// adapters. Adding a transport is an additive proto change +
// matching event-bus runtime adapter. Today's
// set covers durable-broker (NATS), durable-streams (Redis
// Streams), and same-binary in-process (MEMORY); KAFKA, SQS,
// and others are explicitly parked.
//
// Values are prefixed with `TRANSPORT_` per proto3's flat enum-
// value scope — bare `NATS` would collide with `Dialect.NATS`
// (the message-broker dialect-as-capability), and consistent
// prefixing keeps future additions collision-safe.
enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  // TRANSPORT_NATS — JetStream-backed durable queue. Channel
  // name maps to stream prefix; topic becomes subject suffix.
  // Failed deliveries past `max_deliver` go to
  // `<channel>.<topic>.dlq`.
  TRANSPORT_NATS = 1;
  // TRANSPORT_REDIS_STREAMS — Redis Streams. Stream key =
  // `<channel>`, entry field = topic for subscriber-side glob.
  // Retry tracked via PEL; DLQ stream = `<channel>.dlq`.
  TRANSPORT_REDIS_STREAMS = 2;
  // TRANSPORT_MEMORY — direct in-process goroutine + bufconn
  // loopback. Best-effort by design; no persistence, no
  // cross-process. Compiler refuses MEMORY channels whose
  // subscriber surface generates a separate binary.
  TRANSPORT_MEMORY = 3;
}

// EventDefaults carries domain-wide fallbacks that
// apply to every channel + event under the domain when not
// overridden at a more specific tier. Today's only field is
// `retry`; the message exists for future expansion (e.g.
// per-domain observability defaults) without breaking the
// existing wire surface.
message EventDefaults {
  // Domain-default retry policy. Tier 3 in the four-tier
  // retry cascade documented on `Event.retry`. Presence-aware
  // merge: a field unset here falls through to the framework
  // hard default.
  RetryPolicy retry = 1;

  // Domain-default FE delivery thresholds
  // (expected / max / give_up). Tier 2 in the three-tier timing
  // cascade documented on `Event.delivery`: per-event override ->
  // this domain default -> framework hard default
  // (15s / 60s / 300s). Presence-aware merge per field. The
  // `fallback` + `dedup_key` sub-fields are ignored here — only
  // the timing thresholds cascade; the fallback query is
  // inherently per-event.
  EventDelivery delivery = 2;
}
