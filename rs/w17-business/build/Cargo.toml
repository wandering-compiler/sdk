[package]
name = "w17-business-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The build helper of a w17 Rust business tier: compiles the generated descriptor set with tonic-prost-build from the crate's build.rs, no protoc."
license = "MIT"
publish = false

[dependencies]
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
