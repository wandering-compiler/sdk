// PUBLIC SECRETS CONTRACT — an environment's env values and secrets, held by
// the console (encrypted at rest with its field keyring) instead of in sops
// files in the project's repository.
//
// Who may do what is the console's ACL, per method:
//
//   - a person writes values (SetSecret, UnsetSecret) and lists what is SET
//     (ListSecretKeys) — never the values: reading one back is a separate,
//     stepped-up path that is not part of this contract yet;
//   - a deploy reads the values (FetchEnvironmentSecrets), as a machine
//     account whose role grants it, and writes them to the target the way it
//     writes decrypted sops files.
//
// Every write and every fetch is recorded by the console (who, which
// environment, which keys, when). Nothing is deleted: an unset value is kept,
// marked removed, and no longer fetched.
//
// The client does no crypto: values travel over the console's TLS connection,
// to an authenticated caller, and are never written to the repository.
syntax = "proto3";

package w17.secrets;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/envsecrets;envsecretspb";

// EnvironmentSecrets — one environment's values, addressed by
// (project_id, environment, service, key). `service` is the stack service the
// value is for (its `<service>.env` on the target); `key` an env var name.
service EnvironmentSecrets {
  // SetSecret writes one value, replacing the current one. The value is never
  // echoed back.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // UnsetSecret removes one value: it is no longer listed or fetched. Unsetting
  // a key that is not set is no error.
  rpc UnsetSecret(UnsetSecretRequest) returns (UnsetSecretResponse);
  // ListSecretKeys lists what is set in an environment — keys, not values.
  rpc ListSecretKeys(ListSecretKeysRequest) returns (ListSecretKeysResponse);
  // FetchEnvironmentSecrets returns every value set in an environment, by
  // service, for a deploy to write to its target.
  rpc FetchEnvironmentSecrets(FetchEnvironmentSecretsRequest) returns (FetchEnvironmentSecretsResponse);
}

message SetSecretRequest {
  string project_id  = 1;
  string environment = 2;
  string service     = 3;
  string key         = 4;
  string value       = 5;
}

message SetSecretResponse {
  google.protobuf.Timestamp updated_at = 1;
}

message UnsetSecretRequest {
  string project_id  = 1;
  string environment = 2;
  string service     = 3;
  string key         = 4;
}

message UnsetSecretResponse {}

message ListSecretKeysRequest {
  string project_id  = 1;
  string environment = 2;
}

message ListSecretKeysResponse {
  repeated SecretKey keys = 1;
}

// SecretKey — a value that is set, without the value.
message SecretKey {
  string                    service    = 1;
  string                    key        = 2;
  google.protobuf.Timestamp updated_at = 3;
  // The account that last wrote it.
  string                    updated_by = 4;
}

message FetchEnvironmentSecretsRequest {
  string project_id  = 1;
  string environment = 2;
}

message FetchEnvironmentSecretsResponse {
  repeated ServiceSecrets services = 1;
}

// ServiceSecrets — one service's values: what its `<service>.env` gets.
message ServiceSecrets {
  string              service = 1;
  map<string, string> values  = 2;
}
