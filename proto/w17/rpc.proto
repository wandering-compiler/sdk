syntax = "proto3";

package w17;

import "google/protobuf/descriptor.proto";
import "w17/audience.proto";
import "w17/request_events.proto";
import "w17/rest.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/w17;w17pb";

// gRPC gateway ("rpc") exposure
// annotations. The third gateway transport, sibling to REST
// (`rest.proto`) and MCP (`mcp.proto`): a public gRPC surface
// for technical (non-browser) clients over HTTP/2.
//
// Why a gateway in front of services that already speak gRPC:
//   - The gateway layer is NOT a dumb proxy. It runs the same
//     gateway-tier concerns the REST / MCP transports run —
//     `(w17.event_emit_gateway)` intent events, auth /
//     principal resolution from request metadata — between the
//     public call and the backend dispatch.
//   - In a composed `<domain>-server` the storage / business
//     tiers are NOT independently network-exposed; the rpc
//     gateway is the single network gRPC surface that fronts
//     them in-process.
//   - It exposes a curated public contract: pick the methods
//     that go out, regroup them under public service names,
//     hide everything internal.
//
// The transport is named "rpc" (not "grpc") to avoid colliding
// with the literal `grpc` identifiers / package names in
// generated Go.
//
// Shape vs REST / MCP — per-METHOD opt-in (like inline
// `(w17.mcp)`), NOT a whole-service re-export:
//   - A picked method is RE-DECLARED in a brand-new
//     `grpcapi.proto` the gateway generator emits (own services,
//     own — possibly renamed — service names), REUSING the
//     backend message types verbatim (imported, never
//     duplicated). The forward handler is typed end-to-end: the
//     public request/response Go types ARE the backend's.
//   - Because methods are picked individually, the original
//     internal SERVICES are not exposed; only the message TYPES
//     are shared. There is no `Unimplemented` half-service —
//     the new service declares exactly the picked methods.
//
// Driven by the gateway parser: every loaded
// `.proto` carrying `option (w17.rpc_api) = { ... }` declares
// one rpc surface; methods carrying `(w17.rpc) = true` are the
// picks. The generator emits `schema/grpcapi.proto` (public
// contract) + `src/rpc/*.go` (forward handlers + serve), and
// the orchestrator runs protoc for the server bindings under
// `w17/stubs/pb/grpcapi/<domain>-grpcapi` (no stub-module
// clients — w17 doesn't consume this surface internally).

extend google.protobuf.MethodOptions {
  // (w17.rpc) — expose this RPC over the generated gRPC gateway.
  // The method is re-declared in the emitted `grpcapi.proto`
  // under a public service (its original service name by
  // default, or `(w17.rpc_service)` when set), reusing the
  // backend request/response message types. Streaming
  // qualifiers (server / client / bidi) carry over verbatim and
  // are forwarded natively. Sibling-scalar shape mirrors
  // `(w17.mcp)`: a bare bool pick + a separate string
  // override, rather than a message option.
  bool rpc = 50111;

  // (w17.rpc_service) — override the PUBLIC service name this
  // method lands under in the emitted `grpcapi.proto`. Empty =
  // inherit the method's original gRPC service name. Use to
  // regroup methods drawn from several backend services under
  // one public service, or to give a backend service a cleaner
  // public name. The method name itself is always carried 1:1
  // (no rename). Must be an IDENTIFIER — it is emitted verbatim as
  // `service <Name> {` in the generated rpc lock proto, so a space,
  // dash or leading digit yields a proto that does not compile; the
  // parser refuses those. PascalCase is convention and is steered,
  // not enforced. The parser appends/strips no suffix.
  string rpc_service = 50112;
}

extend google.protobuf.FileOptions {
  // (w17.rpc_api) — file-level option declaring this file as an
  // rpc (gRPC gateway) surface registry. A sentinel carrying the
  // surface's identity + knobs; the per-method `(w17.rpc)` flags
  // do the picking. The file declares ZERO messages, like
  // `(w17.rest_api)` and `(w17.mcp_api)`.
  //
  // One rpc surface per domain and audience; two files for the same
  // audience carrying `(w17.rpc_api)` is a hard error. A domain with
  // several audiences declares one `rpc_<audience>.proto` each, with
  // `audience` set, and each audience's gateway listens on its own port;
  // see `w17/audience.proto`.
  RpcApi rpc_api = 50113;
}

// RpcApi declares one gRPC gateway surface — the public set of
// re-declared services the gateway exposes over HTTP/2. The
// picked methods themselves are marked inline via `(w17.rpc)`;
// this message carries only the surface-level metadata + knobs.
message RpcApi {
  // Logical name of the surface — "public" / "partner" /
  // "internal". Surfaces in tooling + diagnostics. Must be a
  // snake_case identifier.
  string name = 1;

  // Version of this surface — "v1" / "v2". Free-form string;
  // also the default version segment of the generated public
  // proto package (`<domain>.gateway.<version>`) when non-empty.
  // Empty = "v1".
  string version = 2;

  // Human-readable description of the gRPC surface. Surfaces in
  // tooling. Empty = no description.
  string description = 3;

  // Enable gRPC server reflection on the emitted gateway server.
  // Default false — a technical public API typically wants
  // reflection on so clients (grpcurl, generated stubs) can
  // discover the surface, but it stays an explicit opt-in so an
  // internal-only surface can keep its shape unadvertised.
  bool reflection = 4;

  // Authentication for this surface — the same `AuthMethod` list, with
  // the same meaning, as `RestApi.auth_methods`: each entry names the RPC
  // that checks a presented credential and the token types it handles.
  // The gRPC gateway reads the credential from the `authorization`
  // metadata key and dispatches on its scheme exactly as REST does on
  // the header: the entries whose token_types cover the scheme are
  // tried in declaration order (first success wins), ANY-typed entries
  // catch a scheme nothing specific handles, and a call no entry
  // accepts is refused UNAUTHENTICATED before any backend is reached.
  // (URL_TOKEN entries never apply here: gRPC has no URL credential.)
  //
  // Auth is a property of the GATEWAY, not of one transport: a domain
  // (one audience of it) has one gateway, and REST, gRPC and the
  // embedded MCP all run behind the same auth step. So this list and
  // `RestApi.auth_methods` (and `McpApi.auth_methods`) are one
  // declaration that may be written on any of the domain's surfaces. A
  // gRPC-only domain declares it here; a domain with several surfaces
  // writes it once, or repeats it identically. Two surfaces declaring
  // DIFFERENT lists are refused at codegen.
  //
  // An activated auth plugin supplies it for you (its preset auth
  // methods are injected whenever the plugin is active), so most
  // projects write nothing here.
  //
  // Empty, with no auth plugin and no other surface declaring it, the
  // surface authenticates no one — and codegen REFUSES that unless the
  // surface says so with `unauthenticated: true` below.
  repeated AuthMethod auth_methods = 5;

  // Logical groupings of the public surface — mirrors
  // `RestApi.groups`. Each group's `name` is a public
  // gRPC service in the emitted `w17.lock.rpc.proto`; its `refs`
  // name the backend methods that service wraps. The picked
  // methods carry the gateway-tier concerns (event emit, auth,
  // ACL cascade) verbatim — auth meaning the gateway's auth methods
  // (`auth_methods` above, or the same list declared on another of the
  // domain's surfaces): with none, there is no principal to carry, and
  // codegen refuses the surface unless it is `unauthenticated`.
  // Empty `groups` + no inline `(w17.rpc)`
  // marks = empty surface (the gateway emit produces nothing).
  //
  // Inline `(w17.rpc)` / `(w17.rpc_service)` marks still work and
  // desugar into a synthesized group named after the method's
  // (override-or-original) backend service — both paths converge
  // on the same internal model.
  repeated RpcGroup groups = 6;

  // The request event stream for this surface (request_events.proto):
  // which purposes its records serve. Absent = no records.
  RequestEvents request_events = 7;

  // The audience this surface is for, when its domain publishes more than
  // one (`rpc_<audience>.proto`): see `w17/audience.proto`. Unset on a
  // domain with a single audience, which keeps `rpc.proto` and the
  // gateway, env names and permission ids it has always had.
  Audience audience = 8;

  // The explicit opt-out: this surface is deliberately public and its
  // gateway authenticates no one. Codegen refuses a surface that serves
  // methods with no auth method unless this is set — "no auth" is never
  // the silent default.
  //
  // It cannot coexist with auth: a gateway with auth methods (declared
  // on any of the domain's surfaces, or supplied by an activated auth
  // plugin) authenticates every surface it serves, so `unauthenticated`
  // there is a contradiction and is refused. Neither can it cover a
  // method that needs a principal — one gated by ACL, or reading a model
  // with `(w17.db.scope)`: those are refused on a public surface, since
  // nothing would supply who is calling.
  bool unauthenticated = 9;

  // Methods of THIS surface callable without a credential, by ref
  // (`<module>.<Service>.<Method>`, as `groups[].refs` name them): the
  // gRPC twin of `RestEndpoint.exclude_auth` — a sign-in, a token mint.
  // Each must be picked on this surface. A REST endpoint's exclude_auth
  // says nothing here: a method public on REST is still authenticated
  // over gRPC unless it is listed. The gateway's own auth methods are
  // exempt on every surface without being listed.
  repeated string exclude_auth = 10;
}

// RpcGroup buckets backend methods under one public gRPC service
// — the gRPC sibling of `RestGroup`. Where REST groups
// surface as a URL sub-prefix + OpenAPI tag, an rpc group's
// `name` IS the public `service` name emitted into
// `w17.lock.rpc.proto`. Methods drawn from several backend
// services may be regrouped under one public service name.
message RpcGroup {
  // Public gRPC service name this group emits into
  // `w17.lock.rpc.proto`. Must be a PascalCase identifier; carried
  // verbatim (no suffix added/stripped). gRPC requires method
  // names unique per service — two refs resolving to the same
  // method name under one group is a parse-time error.
  string name = 1;

  // Human-readable description — surfaces as the leading comment
  // on the emitted public service. Empty = no comment.
  string description = 2;

  // Backend methods this public service wraps, by `ref`. A ref is
  // either a whole service (all its methods) or a single method:
  //
  //   "console.initiatives.InitiativeQuery"               — whole service
  //   "console.initiatives.SnapshotMutation.PushSnapshot" — one method
  //
  // `<module>` is the proto module (last package segment), matching
  // the FK / REST `ref` shape. Resolution is
  // domain-scoped; a cross-domain ref is a parse-time error. The
  // request/response message types are reused verbatim from the
  // backend (imported into the lock, never redefined).
  //
  // Refs (not inline `service X { rpc … }` definitions) because a
  // message can be the input/output of several RPCs across
  // services, so a method-by-message definition is not
  // deterministic about which backend service it wraps. A ref is
  // unambiguous.
  repeated string refs = 3;

  // (optional) An ADDITIONAL fully-qualified gRPC service name to
  // serve this same group under — `"w17.apply.MigrationFetch"`.
  //
  // For a surface that re-hosts a contract published elsewhere.
  // `name` is the service in the emitted lock proto, so the wire
  // name is `<lock package>.<name>` — and a caller built against
  // the PUBLISHED proto dials the published FQN, which no lock
  // package can ever equal. The console re-hosted the deploy
  // registry this way and served
  // `w17lock.console.rpc.MigrationFetch`, while every generated
  // binary called `w17.apply.MigrationFetch` and got
  // `Unimplemented` — the documented production migration path,
  // dead end to end, for as long as it existed. w17ctl worked
  // because it dials the re-hosted client directly; a generated
  // binary has only the public SDK.
  //
  // One implementation, two names: grpc-go registers a copy of
  // the generated ServiceDesc with the name replaced. The method
  // set is whatever `refs` produced — the alias renames, it does
  // not reshape — so the published contract and this group must
  // agree on method names and types, exactly as the
  // re-declaration already had to.
  //
  // Must be a dotted FQN (`pkg.sub.Service`, at least one dot),
  // each segment an identifier; the parser refuses anything else
  // rather than emitting a registration gRPC will never match.
  // Empty = served under the lock name only.
  string public_fqn = 4;
}
