syntax = "proto3";

// Console — environment secrets wire contract (client side).
//
// Plain-protobuf mirror of the messages of the console's EnvironmentSecrets
// service, wire-compatible with the server (same package, message names and
// field numbers). The client is consolegrpcapipb.EnvironmentSecretsClient
// (go/pb/consoleapi/rpc). An environment's env values and secrets, held by the
// console:
//
//   - a person writes and unsets values and lists which keys are set — never
//     the values;
//   - a deploy, as a machine account whose role grants it, fetches the values
//     by service.
//
// Every address is (project_id, environment, service, key): `service` is the
// stack service the value is for (its `<service>.env` on the target), `key`
// an env var name.
package console.secrets;

option go_package = "github.com/wandering-compiler/sdk/go/pb/consoleapi/secrets;secretspb";

import "google/protobuf/timestamp.proto";

message SetSecretReq {
  string project_id  = 1;
  string environment = 2;
  string service     = 3;
  string key         = 4;
  // The value. At most 64 KiB: an env value, not a file.
  string value       = 5;
  // An environment variable (shown back when listed) rather than a secret
  // (write-only). Both are encrypted at rest and reach the deploy alike.
  bool   plain       = 6;
}

message SetSecretResp {
  google.protobuf.Timestamp updated_at = 1;
}

message UnsetSecretReq {
  string project_id  = 1;
  string environment = 2;
  string service     = 3;
  string key         = 4;
}

message UnsetSecretResp {}

message ListSecretKeysReq {
  string project_id  = 1;
  string environment = 2;
}

message ListSecretKeysResp {
  repeated SecretKey keys = 1;
}

// SecretKey — a value that is set, without the value.
message SecretKey {
  string                    service    = 1;
  string                    key        = 2;
  google.protobuf.Timestamp updated_at = 3;
  // The account that last wrote it.
  string                    updated_by = 4;
  // An environment variable, and `value` is its value. FALSE for a secret,
  // whose value is never listed.
  bool                      plain      = 5;
  string                    value      = 6;
}

message FetchEnvironmentSecretsReq {
  string project_id  = 1;
  string environment = 2;
  // The commit being deployed, as the deploy says it; recorded with the fetch.
  string deploy_ref  = 3;
}

message FetchEnvironmentSecretsResp {
  repeated ServiceSecrets services = 1;
}

// ServiceSecrets — one service's values: what its `<service>.env` gets.
message ServiceSecrets {
  string               service = 1;
  repeated SecretValue values  = 2;
}

message SecretValue {
  string key   = 1;
  string value = 2;
}

// A sealed write (decision secrets-env-and-bot-tokens-in-the-console, "Sealed
// writes"): the CLI trades the code a person minted in the console's page for
// the write grant's public key, seals each value to it with
// lib/secretseal, and sends them in one SetSealedSecrets, which ends the grant.
message OpenSecretWriteGrantReq {
  string project_id  = 1;
  string environment = 2;
  string code        = 3;
}

message OpenSecretWriteGrantResp {
  string                    grant_id   = 1;
  // The grant's HPKE public key, base64.
  string                    public_key = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message SetSealedSecretsReq {
  string project_id  = 1;
  string environment = 2;
  string grant_id    = 3;
  string code        = 4;
  repeated SealedSecret values = 5;
}

message SealedSecret {
  string service = 1;
  string key     = 2;
  // secretseal.Seal(public_key, grant_id, service, key, value), base64.
  string sealed  = 3;
  // An environment variable rather than a secret.
  bool   plain   = 4;
}

message SetSealedSecretsResp {
  int32 count = 1;
}
