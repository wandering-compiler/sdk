[package]
name = "w17-business"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The w17 business-tier SDK for Rust: serves the tonic services an author's crate compiles from the generated descriptor set, with the middleware the Go, Python and TypeScript tiers apply."
license = "MIT"
publish = false

[workspace]
members = ["build", "tests/conformance/service"]

[dependencies]
# tonic and prost are the majors an author's crate is built on too: the code
# tonic-prost-build generates names them by absolute path. Moving either is a
# breaking change for every Rust tier.
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "channel", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tonic-health = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false, features = ["server"] }
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2", "service", "server-graceful"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"

# TLS as rs/storage-proxy builds it: rustls with the ring provider, no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = "0.18"

serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
fastrand = "2"
humantime = "2"
age = "0.11"

async-nats = "0.52"
redis = { version = "1", default-features = false, features = ["tokio-comp", "cluster-async", "streams", "tokio-rustls-comp", "tls-rustls"] }

sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace", "tls-ring"] }

[build-dependencies]
tonic-prost-build = "0.14"
prost-types = "0.14"
prost = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
