syntax = "proto3";

package w17;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/w17;w17pb";

// GrantClient — the CONTRACT a product may implement for the grant side to
// call: told when what an organization can hold or show changes, so the
// product can react (provision an engine, refresh a cache, notify its
// people). Nothing calls it yet; the auth plugin's org_packages and the grant
// plugin hold the state and enforce it themselves. Declared, with its gRPC
// server and client generated, so a product's handler and a future caller
// agree on one shape.
service GrantClient {
  // PackagesChanged — an organization was given or lost packages.
  rpc PackagesChanged(PackagesChangedReq) returns (PackagesChangedResp);
  // EnvelopeDecided — an organization's envelope was approved or rejected.
  rpc EnvelopeDecided(EnvelopeDecidedReq) returns (EnvelopeDecidedResp);
}

message PackagesChangedReq {
  string org_id = 1;
  // packages are the organization's live packages after the change, as
  // given — names, includes not expanded (the domain's protos expand them).
  repeated string packages = 2;
  // changed_at orders deliveries: a product applies a call only when it is
  // newer than the last one it applied for the organization.
  google.protobuf.Timestamp changed_at = 3;
}
message PackagesChangedResp {}

// EnvelopeDecision — what the backoffice decided.
enum EnvelopeDecision {
  ENVELOPE_DECISION_UNSPECIFIED = 0;
  ENVELOPE_DECISION_APPROVED    = 1;
  ENVELOPE_DECISION_REJECTED    = 2;
}

message EnvelopeDecidedReq {
  string org_id      = 1;
  string envelope_id = 2;
  EnvelopeDecision decision = 3;
  google.protobuf.Timestamp decided_at = 4;
}
message EnvelopeDecidedResp {}
